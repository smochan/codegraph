# Claude-Code-style benchmark configurations.
#
# Each configuration is a named bundle of MCP servers Claude has access to.
# The agent harness runs the same question set under every configuration so
# the only thing that varies is the registered tool surface.
#
# `command` + `args` are evaluated relative to each per-tool venv where
# applicable. The harness fills in `{repo_path}` placeholders at runtime.

configurations:
  baseline:
    description: "Claude with no code-aware tools. Pure model knowledge + general reasoning."
    servers: []

  polycodegraph:
    description: "Claude + polycodegraph MCP server (18 graph tools)."
    servers:
      - name: polycodegraph
        command: .venv/bin/codegraph
        args: ["mcp", "serve"]
        cwd_is_target_repo: true

  code-review-graph:
    description: "Claude + code-review-graph MCP server (28 graph tools)."
    servers:
      - name: code-review-graph
        command: bench/.venvs/code-review-graph/bin/code-review-graph
        args: ["serve"]
        cwd_is_target_repo: true

  # graphify removed from agent bench: its MCP server corrupts its stdio JSON-RPC
  # stream with banner/log output mid-call, which trips anyio's cancel scope on
  # cleanup. Connect + list_tools work; actual tool calls do not. Tracked
  # separately. Pass Q (bench query) still includes graphify successfully.

  better-code-review-graph:
    description: "Claude + better-code-review-graph MCP server (6 composite tools)."
    servers:
      - name: better-crg
        command: bench/.venvs/better-code-review-graph/bin/better-code-review-graph
        args: []
        cwd_is_target_repo: true

  both:
    description: "Claude with polycodegraph + code-review-graph MCPs registered concurrently."
    servers:
      - name: polycodegraph
        command: .venv/bin/codegraph
        args: ["mcp", "serve"]
        cwd_is_target_repo: true
      - name: code-review-graph
        command: bench/.venvs/code-review-graph/bin/code-review-graph
        args: ["serve"]
        cwd_is_target_repo: true
