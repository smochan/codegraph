# Claude-Code-style benchmark configurations.
#
# Each configuration is a named bundle of MCP servers Claude has access to.
# The agent harness runs the same question set under every configuration so
# the only thing that varies is the registered tool surface.
#
# `command` + `args` are evaluated relative to each per-tool venv where
# applicable. The harness fills in `{repo_path}` placeholders at runtime.

configurations:
  baseline:
    description: "Claude with no code-aware tools. Pure model knowledge + general reasoning."
    servers: []

  polycodegraph:
    description: "Claude + polycodegraph MCP server (18 graph tools)."
    servers:
      - name: polycodegraph
        command: .venv/bin/codegraph
        args: ["mcp", "serve"]
        cwd_is_target_repo: true

  code-review-graph:
    description: "Claude + code-review-graph MCP server (28 graph tools)."
    servers:
      - name: code-review-graph
        command: bench/.venvs/code-review-graph/bin/code-review-graph
        args: ["serve"]
        cwd_is_target_repo: true

  both:
    description: "Claude with both graph MCPs registered concurrently."
    servers:
      - name: polycodegraph
        command: .venv/bin/codegraph
        args: ["mcp", "serve"]
        cwd_is_target_repo: true
      - name: code-review-graph
        command: bench/.venvs/code-review-graph/bin/code-review-graph
        args: ["serve"]
        cwd_is_target_repo: true
