# Target repos for the benchmark.
# Each entry pins commit ranges so runs are deterministic.
# `path` is optional: if present, the repo is treated as already cloned at that path.
# Otherwise, the harness shallow-clones `url` into bench/results/<run-id>/repos/<name>/.

repos:
  - name: codegraph-self
    # Dogfood smoke-test: run the bench against polycodegraph's own git history.
    path: .
    language: python
    commits:
      # HEAD-relative; resolved at runtime by `git rev-parse`.
      - HEAD

